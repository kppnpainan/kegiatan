<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Kegiatan KPPN Painan Hari ini</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, sans-serif;
  background:#e7e7e7;
  padding:18px;
  color:#111;
}

.container{
  width:100%;
  max-width:950px;
  margin:auto;
}

/* TOP */
.top-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
  align-items:center;
}

#filterDate{
  padding:10px 14px;
  border:2px solid #6c7ea5;
  border-radius:8px;
  font-size:14px;
  background:white;
}

.btn{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#d8d8d8;
  border:2px solid #6c7ea5;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.btn:hover{
  background:#cfcfcf;
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:28px;
}

.header h2{
  font-size:clamp(22px,4vw,32px);
  margin-bottom:12px;
}

.tanggal{
  font-size:18px;
  text-decoration:underline;
  font-weight:bold;
}

/* CARD */
.card{
  border:2px solid #3f66b3;
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-2px);
}

/* WARNA */
.card.blue{
  background:#8fb0d1;
}

.card.yellow{
  background:#f2cf58;
}

.card.gray{
  background:#d8d8d8;
}

/* INFO */
.info{
  flex:1;
  text-align:center;
  line-height:1.9;
}

.item{
  margin-bottom:4px;
}

.label{
  color:#222;
  font-size:15px;
}

.value{
  color:#0a2f78;
  font-weight:bold;
  font-size:15px;
}

/* BUTTON LINK */
.tempat-btn{
  width:115px;
  height:115px;
  border-radius:50%;
  border:none;
  background:#3565c8;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  padding:12px;
  box-shadow:
    inset 0 0 8px rgba(0,0,0,0.25);
}

.tempat-btn:hover{
  opacity:0.92;
}

/* TEMPAT TEXT */
.tempat-text{
  width:115px;
  min-height:115px;
  border-radius:20px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:12px;
  font-size:13px;
  font-weight:bold;
  color:#163a86;
  word-break:break-word;
}

/* KOSONG */
.kosong{
  background:white;
  padding:40px;
  border-radius:18px;
  text-align:center;
  font-size:18px;
}

/* MOBILE */
@media(max-width:768px){

  .card{
    flex-direction:column;
    text-align:center;
    padding:22px 16px;
  }

  .info{
    width:100%;
  }

  .tempat-btn,
  .tempat-text{
    width:100%;
    min-height:65px;
    height:auto;
    border-radius:18px;
  }

}

@media(max-width:480px){

  body{
    padding:12px;
  }

  .top-bar{
    flex-direction:column;
    align-items:stretch;
  }

  #filterDate,
  .btn{
    width:100%;
  }

  .tanggal{
    font-size:16px;
  }

}

</style>
</head>

<body>

<div class="container">

  <!-- FILTER -->
  <div class="top-bar">

    <input type="date" id="filterDate">

    <button class="btn" onclick="fetchData()">
      Cek kegiatan di hari lain
    </button>

  </div>

  <!-- HEADER -->
  <div class="header">

    <h2>DATA KEGIATAN KPPN PAINAN</h2>

    <div class="tanggal" id="tanggalText">
      -
    </div>

  </div>

  <!-- LIST -->
  <div id="listKegiatan"></div>

</div>

<script>

const sheetURL = 'https://script.google.com/macros/s/AKfycbzrfI5ucFrwPk8tfGviG3uIBUdsLC2UjSI--6T_2XQttdHMEwnnN4csT5fxx5ye7BvQ/exec';

const warnaCard = ['gray','yellow','blue'];

/* TODAY */
function getTodayLocalISO(){

  const now = new Date();

  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');

  return `${y}-${m}-${d}`;

}

/* HEADER DATE */
function formatTanggalIndonesia(dateString){

  const hariNama = [
    'MINGGU',
    'SENIN',
    'SELASA',
    'RABU',
    'KAMIS',
    'JUMAT',
    'SABTU'
  ];

  const bulanNama = [
    'JANUARI',
    'FEBRUARI',
    'MARET',
    'APRIL',
    'MEI',
    'JUNI',
    'JULI',
    'AGUSTUS',
    'SEPTEMBER',
    'OKTOBER',
    'NOVEMBER',
    'DESEMBER'
  ];

  const d = new Date(dateString);

  return `${hariNama[d.getDay()]}, ${d.getDate()} ${bulanNama[d.getMonth()]} ${d.getFullYear()}`;

}

/* FORMAT */
function formatTanggal(dateStr){

  if(!dateStr) return '-';

  const date = new Date(dateStr);

  return date.toLocaleDateString('id-ID',{
    day:'2-digit',
    month:'2-digit',
    year:'numeric'
  });

}

function formatWaktu(time){

  if(!time) return '-';

  const date = new Date(time);

  if(isNaN(date.getTime())){
    return String(time).slice(0,5);
  }

  return date.toLocaleTimeString('id-ID',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });

}

/* TEMPAT */
function renderTempat(tempat){

  if(!tempat){

    return `<div class="tempat-text">-</div>`;

  }

  const isi = tempat.trim();

  const isLink =
    isi.includes('http') ||
    isi.includes('.com') ||
    isi.includes('.id');

  if(isLink){

    let link = isi;

    if(!link.startsWith('http')){
      link = 'https://' + link;
    }

    return `
      <button class="tempat-btn"
      onclick="window.open('${link}','_blank')">
        Klik<br>Tautan
      </button>
    `;

  }

  return `
    <div class="tempat-text">
      ${isi}
    </div>
  `;

}

/* LOAD DATA */
async function fetchData(){

  const tanggal = document.getElementById('filterDate').value;

  document.getElementById('tanggalText').innerHTML =
    formatTanggalIndonesia(tanggal);

  const list = document.getElementById('listKegiatan');

  list.innerHTML = `
    <div class="kosong">
      Loading...
    </div>
  `;

  try{

    const res = await fetch(sheetURL);
    const data = await res.json();

    const filtered = data.filter(row=>{

      if(!row['Tanggal']) return false;

      const rowDate = new Date(row['Tanggal']);

      const yyyy = rowDate.getFullYear();
      const mm = String(rowDate.getMonth()+1).padStart(2,'0');
      const dd = String(rowDate.getDate()).padStart(2,'0');

      return `${yyyy}-${mm}-${dd}` === tanggal;

    });

    if(filtered.length === 0){

      list.innerHTML = `
        <div class="kosong">
          Tidak ada kegiatan pada tanggal ini
        </div>
      `;

      return;

    }

    list.innerHTML = '';

    filtered.forEach((row,index)=>{

      const warna = warnaCard[index % warnaCard.length];

      list.innerHTML += `

      <div class="card ${warna}">

        <div class="info">

          <div class="item">
            <span class="label">NAMA KEGIATAN :</span>
            <span class="value">
              ${row['Nama Rapat'] || '-'}
            </span>
          </div>

          <div class="item">
            <span class="label">TANGGAL - WAKTU :</span>
            <span class="value">
              ${formatTanggal(row['Tanggal'])}
              ${formatWaktu(row['Waktu'])}
            </span>
          </div>

          <div class="item">
            <span class="label">UIC :</span>
            <span class="value">
              ${row['UIC'] || '-'}
            </span>
          </div>

          <div class="item">
            <span class="label">PESERTA :</span>
            <span class="value">
              ${row['Peserta'] || '-'}
            </span>
          </div>

        </div>

        ${renderTempat(row['Tempat'])}

      </div>

      `;

    });

  }catch(err){

    console.error(err);

    list.innerHTML = `
      <div class="kosong">
        Gagal memuat data
      </div>
    `;

  }

}

window.onload = ()=>{

  const today = getTodayLocalISO();

  document.getElementById('filterDate').value = today;

  fetchData();

}

</script>

</body>
</html>
